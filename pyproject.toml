[project]
name = "sg-solar-nowcast"
version = "0.1.0"
description = "Multimodal probabilistic GHI nowcasting for Singapore (t+1/2/3h)"
requires-python = ">=3.12,<3.13"
# Everything needed to TRAIN and evaluate, including the neural ablation.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "torch>=2.4",
    "lightgbm>=4.5",
    "catboost>=1.2",
    "pvlib>=0.11",
    "pyyaml>=6.0",
    "requests>=2.32",
    "urllib3>=2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10",
    "pytest>=8.3",
    "httpx>=0.27",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
# Just enough to SERVE the CatBoost model and run one scheduled cycle. No torch:
# predict.py imports it lazily, and the served model is ~2 MB of .cbm files. This
# is what the GitHub Actions workflow installs.
serve = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "catboost>=1.2",
    "pvlib>=0.11",
    "pyyaml>=6.0",
    "requests>=2.32",
    "urllib3>=2.2",
    "fastapi>=0.115",
    "apscheduler>=3.10",
    "pyarrow>=17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Flat layout with several top-level dirs (data/, models/, api/, tests/, scripts/)
# confuses setuptools auto-discovery. Modules are imported by path, not installed.
[tool.setuptools]
py-modules = []
